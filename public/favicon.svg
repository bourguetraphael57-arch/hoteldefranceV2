<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <rect width="32" height="32" rx="7" fill="#FAF8F5" stroke="#E2D9CC" stroke-width="0.8" />
  
  <!-- 3 Stars -->
  <g fill="#C5A059" transform="translate(16, 5)">
    <!-- Star Left -->
    <polygon points="-6,-2 -5.2,-0.5 -3.5,-0.4 -4.8,0.7 -4.4,2.4 -6,1.4 -7.6,2.4 -7.2,0.7 -8.5,-0.4 -6.8,-0.5" />
    <!-- Star Center -->
    <polygon points="0,-2 0.8,-0.5 2.5,-0.4 1.2,0.7 1.6,2.4 0,1.4 -1.6,2.4 -1.2,0.7 -2.5,-0.4 -0.8,-0.5" />
    <!-- Star Right -->
    <polygon points="6,-2 6.8,-0.5 8.5,-0.4 7.2,0.7 7.6,2.4 6,1.4 4.4,2.4 4.8,0.7 3.5,-0.4 5.2,-0.5" />
  </g>

  <!-- Facade Silhouette / Line-art -->
  <!-- Base ground line -->
  <line x1="4" y1="28" x2="28" y2="28" stroke="#1A2B49" stroke-width="1.2" stroke-linecap="round" />

  <!-- Main wall -->
  <rect x="6" y="14" width="20" height="13.5" stroke="#1A2B49" stroke-width="1.1" fill="#FFFFFF" />

  <!-- Roof with mansard slope -->
  <polygon points="8,9 24,9 26.5,14 5.5,14" stroke="#1A2B49" stroke-width="1.1" fill="#FAF8F5" stroke-linejoin="round" />
  <line x1="7.5" y1="9" x2="24.5" y2="9" stroke="#C5A059" stroke-width="1.1" stroke-linecap="round" />

  <!-- Central Dormer -->
  <polygon points="14.5,11.5 16,9.5 17.5,11.5 17.5,14 14.5,14" fill="#C5A059" stroke="#1A2B49" stroke-width="0.8" stroke-linejoin="round" />

  <!-- Windows upper floor -->
  <rect x="8.5" y="15.8" width="2.2" height="3" fill="#1A2B49" />
  <rect x="12.5" y="15.8" width="2.2" height="3" fill="#1A2B49" />
  <rect x="17.3" y="15.8" width="2.2" height="3" fill="#1A2B49" />
  <rect x="21.3" y="15.8" width="2.2" height="3" fill="#1A2B49" />

  <!-- Ground floor arched entrance -->
  <path d="M 14.2 27.5 L 14.2 22 A 1.8 1.8 0 0 1 17.8 22 L 17.8 27.5 Z" fill="#C5A059" stroke="#1A2B49" stroke-width="0.9" />
</svg>
