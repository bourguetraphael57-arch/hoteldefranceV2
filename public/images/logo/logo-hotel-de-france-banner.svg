<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none" role="img" aria-label="Logo Grand Hôtel de France Meyrueis - Fond Blanc">
  <!-- Pure white background with lots of white space -->
  <rect width="1200" height="400" fill="#FFFFFF" />

  <defs>
    <!-- 5-pointed star symbol -->
    <g id="star-banner">
      <polygon points="0,-8 2.47,-2.47 8.41,-2.11 3.91,1.91 5.28,7.76 0,4.63 -5.28,7.76 -3.91,1.91 -8.41,-2.11 -2.47,-2.47" fill="#C5A059" />
    </g>
  </defs>

  <style>
    .b-hotel-name {
      font-family: 'Source Serif 4', 'Cinzel', 'Playfair Display', 'Didot', 'Baskerville', 'Georgia', serif;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 0.15em;
      fill: #1A2B49;
      text-anchor: middle;
    }
    .b-hotel-tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.38em;
      fill: #C5A059;
      text-anchor: middle;
      text-transform: uppercase;
    }
  </style>

  <!-- Centered Logo Group -->
  <g transform="translate(130, 85)">
    <!-- ==================== LEFT SIDE: HOTEL FACADE ICON ==================== -->
    <g transform="translate(0, 0)">
      <!-- Ground line -->
      <line x1="30" y1="192" x2="226" y2="192" stroke="#1A2B49" stroke-width="2.4" stroke-linecap="round" />
      <!-- Pedestal step -->
      <line x1="40" y1="188" x2="216" y2="188" stroke="#1A2B49" stroke-width="1.3" stroke-linecap="round" />

      <!-- Main facade boundary -->
      <rect x="46" y="94" width="164" height="94" stroke="#1A2B49" stroke-width="2" fill="none" />

      <!-- Roofline (Mansard & classic sloped roof) -->
      <path d="M 64 56 L 192 56 L 214 94 L 42 94 Z" stroke="#1A2B49" stroke-width="2" fill="none" stroke-linejoin="round" />
      <!-- Roof ridge cap -->
      <line x1="60" y1="56" x2="196" y2="56" stroke="#C5A059" stroke-width="2.4" stroke-linecap="round" />

      <!-- Left & Right Chimneys -->
      <rect x="70" y="42" width="11" height="14" stroke="#1A2B49" stroke-width="1.6" fill="none" />
      <line x1="68" y1="42" x2="83" y2="42" stroke="#C5A059" stroke-width="2" stroke-linecap="round" />
      <rect x="175" y="42" width="11" height="14" stroke="#1A2B49" stroke-width="1.6" fill="none" />
      <line x1="173" y1="42" x2="188" y2="42" stroke="#C5A059" stroke-width="2" stroke-linecap="round" />

      <!-- Central Dormer window on roof -->
      <path d="M 117 72 L 128 58 L 139 72 L 139 94 L 117 94 Z" stroke="#1A2B49" stroke-width="1.6" fill="none" stroke-linejoin="round" />
      <path d="M 122 88 L 122 79 A 6 6 0 0 1 134 79 L 134 88 Z" stroke="#C5A059" stroke-width="1.4" fill="none" />
      <line x1="128" y1="73" x2="128" y2="88" stroke="#C5A059" stroke-width="1" />

      <!-- Left Dormer -->
      <path d="M 82 77 L 91 66 L 100 77 L 100 94 L 82 94 Z" stroke="#1A2B49" stroke-width="1.4" fill="none" stroke-linejoin="round" />
      <rect x="86" y="80" width="10" height="11" rx="1" stroke="#1A2B49" stroke-width="1.1" fill="none" />

      <!-- Right Dormer -->
      <path d="M 156 77 L 165 66 L 174 77 L 174 94 L 156 94 Z" stroke="#1A2B49" stroke-width="1.4" fill="none" stroke-linejoin="round" />
      <rect x="160" y="80" width="10" height="11" rx="1" stroke="#1A2B49" stroke-width="1.1" fill="none" />

      <!-- Entablature / Roof cornice frieze -->
      <line x1="42" y1="98" x2="214" y2="98" stroke="#C5A059" stroke-width="1.4" />
      
      <!-- Floor divider stringcourses -->
      <line x1="46" y1="129" x2="210" y2="129" stroke="#1A2B49" stroke-width="1.1" />
      <line x1="46" y1="160" x2="210" y2="160" stroke="#C5A059" stroke-width="1.4" />

      <!-- UPPER FLOOR (3rd floor) - 5 window bays -->
      <rect x="58" y="105" width="11" height="17" rx="1" stroke="#1A2B49" stroke-width="1.3" fill="none" />
      <line x1="55" y1="106" x2="55" y2="121" stroke="#1A2B49" stroke-width="1" />
      <line x1="72" y1="106" x2="72" y2="121" stroke="#1A2B49" stroke-width="1" />

      <rect x="88" y="105" width="11" height="17" rx="1" stroke="#1A2B49" stroke-width="1.3" fill="none" />
      <line x1="85" y1="106" x2="85" y2="121" stroke="#1A2B49" stroke-width="1" />
      <line x1="102" y1="106" x2="102" y2="121" stroke="#1A2B49" stroke-width="1" />

      <!-- Center with pediment -->
      <path d="M 121 103 L 128 99 L 135 103" stroke="#C5A059" stroke-width="1.2" fill="none" />
      <rect x="122.5" y="105" width="11" height="17" rx="1" stroke="#1A2B49" stroke-width="1.3" fill="none" />
      <line x1="119.5" y1="106" x2="119.5" y2="121" stroke="#1A2B49" stroke-width="1" />
      <line x1="136.5" y1="106" x2="136.5" y2="121" stroke="#1A2B49" stroke-width="1" />

      <rect x="157" y="105" width="11" height="17" rx="1" stroke="#1A2B49" stroke-width="1.3" fill="none" />
      <line x1="154" y1="106" x2="154" y2="121" stroke="#1A2B49" stroke-width="1" />
      <line x1="171" y1="106" x2="171" y2="121" stroke="#1A2B49" stroke-width="1" />

      <rect x="187" y="105" width="11" height="17" rx="1" stroke="#1A2B49" stroke-width="1.3" fill="none" />
      <line x1="184" y1="106" x2="184" y2="121" stroke="#1A2B49" stroke-width="1" />
      <line x1="201" y1="106" x2="201" y2="121" stroke="#1A2B49" stroke-width="1" />

      <!-- MIDDLE FLOOR (2nd floor) - 5 French windows with mullions -->
      <rect x="58" y="136" width="11" height="18" rx="1" stroke="#1A2B49" stroke-width="1.3" fill="none" />
      <line x1="63.5" y1="136" x2="63.5" y2="154" stroke="#1A2B49" stroke-width="0.8" />
      <line x1="55" y1="137" x2="55" y2="153" stroke="#1A2B49" stroke-width="1" />
      <line x1="72" y1="137" x2="72" y2="153" stroke="#1A2B49" stroke-width="1" />

      <rect x="88" y="136" width="11" height="18" rx="1" stroke="#1A2B49" stroke-width="1.3" fill="none" />
      <line x1="93.5" y1="136" x2="93.5" y2="154" stroke="#1A2B49" stroke-width="0.8" />
      <line x1="85" y1="137" x2="85" y2="153" stroke="#1A2B49" stroke-width="1" />
      <line x1="102" y1="137" x2="102" y2="153" stroke="#1A2B49" stroke-width="1" />

      <!-- Center balcony window -->
      <rect x="122.5" y="136" width="11" height="18" rx="1" stroke="#1A2B49" stroke-width="1.3" fill="none" />
      <line x1="128" y1="136" x2="128" y2="154" stroke="#1A2B49" stroke-width="0.8" />
      <line x1="119.5" y1="137" x2="119.5" y2="153" stroke="#1A2B49" stroke-width="1" />
      <line x1="136.5" y1="137" x2="136.5" y2="153" stroke="#1A2B49" stroke-width="1" />
      <line x1="121" y1="151" x2="135" y2="151" stroke="#C5A059" stroke-width="1.3" />

      <rect x="157" y="136" width="11" height="18" rx="1" stroke="#1A2B49" stroke-width="1.3" fill="none" />
      <line x1="162.5" y1="136" x2="162.5" y2="154" stroke="#1A2B49" stroke-width="0.8" />
      <line x1="154" y1="137" x2="154" y2="153" stroke="#1A2B49" stroke-width="1" />
      <line x1="171" y1="137" x2="171" y2="153" stroke="#1A2B49" stroke-width="1" />

      <rect x="187" y="136" width="11" height="18" rx="1" stroke="#1A2B49" stroke-width="1.3" fill="none" />
      <line x1="192.5" y1="136" x2="192.5" y2="154" stroke="#1A2B49" stroke-width="0.8" />
      <line x1="184" y1="137" x2="184" y2="153" stroke="#1A2B49" stroke-width="1" />
      <line x1="201" y1="137" x2="201" y2="153" stroke="#1A2B49" stroke-width="1" />

      <!-- GROUND FLOOR - Arched stone entrance & windows -->
      <path d="M 57 188 L 57 173 A 6.5 6.5 0 0 1 70 173 L 70 188 Z" stroke="#1A2B49" stroke-width="1.3" fill="none" />
      <path d="M 87 188 L 87 173 A 6.5 6.5 0 0 1 100 173 L 100 188 Z" stroke="#1A2B49" stroke-width="1.3" fill="none" />

      <!-- Central Entrance Portal -->
      <path d="M 117 188 L 117 171 A 11 11 0 0 1 139 171 L 139 188" stroke="#1A2B49" stroke-width="2.2" fill="none" />
      <path d="M 119.5 188 L 119.5 172 A 8.5 8.5 0 0 1 136.5 172 L 136.5 188" stroke="#C5A059" stroke-width="1.1" fill="none" />
      <line x1="128" y1="174" x2="128" y2="188" stroke="#1A2B49" stroke-width="1.2" />
      <polygon points="126,166 130,166 129,170 127,170" fill="#C5A059" />

      <path d="M 156 188 L 156 173 A 6.5 6.5 0 0 1 169 173 L 169 188 Z" stroke="#1A2B49" stroke-width="1.3" fill="none" />
      <path d="M 186 188 L 186 173 A 6.5 6.5 0 0 1 199 173 L 199 188 Z" stroke="#1A2B49" stroke-width="1.3" fill="none" />

      <circle cx="112" cy="175" r="1.8" fill="#C5A059" />
      <circle cx="144" cy="175" r="1.8" fill="#C5A059" />
    </g>

    <!-- ==================== VERTICAL ELEGANT DIVIDER ==================== -->
    <line x1="266" y1="62" x2="266" y2="178" stroke="#E2D9CC" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="266" cy="120" r="2.5" fill="#C5A059" />

    <!-- ==================== RIGHT SIDE: TYPOGRAPHY & STARS ==================== -->
    <!-- 3 Stars: aligned, gold, evenly spaced -->
    <g transform="translate(605, 74)">
      <use href="#star-banner" x="-34" y="0" />
      <use href="#star-banner" x="0" y="0" />
      <use href="#star-banner" x="34" y="0" />
    </g>

    <!-- Hotel Name -->
    <text x="605" y="126" class="b-hotel-name">GRAND HÔTEL DE FRANCE</text>

    <!-- Decorative baseline rules flanking tagline -->
    <line x1="330" y1="156" x2="415" y2="156" stroke="#C5A059" stroke-width="1" stroke-linecap="round" opacity="0.65" />
    <polygon points="423,156 426,153.5 429,156 426,158.5" fill="#C5A059" />

    <!-- Tagline -->
    <text x="605" y="161" class="b-hotel-tagline">MEYRUEIS · DEPUIS 1946</text>

    <polygon points="781,156 784,153.5 787,156 784,158.5" fill="#C5A059" />
    <line x1="795" y1="156" x2="880" y2="156" stroke="#C5A059" stroke-width="1" stroke-linecap="round" opacity="0.65" />
  </g>
</svg>
